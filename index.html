<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#FF6B35">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="Trailer Márcio & Zane - O melhor xis da região! Faça seu pedido online.">
    <title>Trailer Márcio & Zane - Pedidos Online</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo" onclick="navigate('home')">
                    <div class="logo-icon">🍔</div>
                    <div class="logo-text">
                        <span class="logo-title">Trailer Márcio & Zane</span>
                        <span class="logo-subtitle">Sua fome é nossa alegria!</span>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="theme-toggle" onclick="toggleTheme()" title="Alternar tema" aria-label="Alternar tema">
                        <span class="theme-icon-light">☀️</span>
                        <span class="theme-icon-dark">🌙</span>
                    </button>
                    <a href="#" class="header-cart" onclick="navigate('carrinho'); return false;" aria-label="Ver carrinho">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <path d="M16 10a4 4 0 0 1-8 0"></path>
                        </svg>
                        <span class="cart-badge"></span>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main -->
    <main class="main">
        <!-- HOME PAGE -->
        <div id="page-home" class="page active">
            <div class="container">
                <section class="hero fade-in-up">
                    <h1 class="hero-title">Faça seu pedido</h1>
                    <p class="hero-subtitle">Escolha o que deseja</p>
                </section>
                <nav class="menu-grid">
                    <a href="#" class="menu-card xis card-entrance stagger-1" onclick="navigate('xis'); return false;">
                        <div class="menu-card-icon">🍔</div>
                        <div class="menu-card-title">Lanches</div>
                        <div class="menu-card-count">12 opções</div>
                    </a>
                    <a href="#" class="menu-card bebidas card-entrance stagger-2" onclick="navigate('bebidas'); return false;">
                        <div class="menu-card-icon">🥤</div>
                        <div class="menu-card-title">Bebidas</div>
                        <div class="menu-card-count">21 opções</div>
                    </a>
                    <a href="#" class="menu-card adicionais card-entrance stagger-3" onclick="navigate('adicionais'); return false;">
                        <div class="menu-card-icon">➕</div>
                        <div class="menu-card-title">Adicionais</div>
                        <div class="menu-card-count">7 opções</div>
                    </a>
                    <a href="#" class="menu-card outros card-entrance stagger-4" onclick="navigate('outros'); return false;">
                        <div class="menu-card-icon">🍋</div>
                        <div class="menu-card-title">Outros</div>
                        <div class="menu-card-count">1 opção</div>
                    </a>
                    <a href="#" class="menu-card carrinho card-entrance stagger-5" onclick="navigate('carrinho'); return false;">
                        <div class="menu-card-icon">🛒</div>
                        <div class="menu-card-title">Carrinho</div>
                        <div class="menu-card-count">Ver itens</div>
                    </a>
                </nav>
            </div>
        </div>

        <!-- XIS PAGE -->
        <div id="page-xis" class="page">
            <div class="container">
                <div class="page-header fade-in-up">
                    <a href="#" class="back-btn" onclick="navigate('home'); return false;" aria-label="Voltar">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <path d="M19 12H5M12 19l-7-7 7-7"/>
                        </svg>
                    </a>
                    <h1 class="page-title">Lanches</h1>
                </div>
                <div class="products-grid" id="xis-grid"></div>
            </div>
        </div>

        <!-- BEBIDAS PAGE -->
        <div id="page-bebidas" class="page">
            <div class="container">
                <div class="page-header fade-in-up">
                    <a href="#" class="back-btn" onclick="navigate('home'); return false;" aria-label="Voltar">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <path d="M19 12H5M12 19l-7-7 7-7"/>
                        </svg>
                    </a>
                    <h1 class="page-title">Bebidas</h1>
                </div>
                <div class="products-grid" id="bebidas-grid"></div>
            </div>
        </div>

        <!-- ADICIONAIS PAGE -->
        <div id="page-adicionais" class="page">
            <div class="container">
                <div class="page-header fade-in-up">
                    <a href="#" class="back-btn" onclick="navigate('home'); return false;" aria-label="Voltar">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <path d="M19 12H5M12 19l-7-7 7-7"/>
                        </svg>
                    </a>
                    <h1 class="page-title">Adicionais</h1>
                </div>
                <div class="products-grid" id="adicionais-grid"></div>
            </div>
        </div>

        <!-- OUTROS PAGE -->
        <div id="page-outros" class="page">
            <div class="container">
                <div class="page-header fade-in-up">
                    <a href="#" class="back-btn" onclick="navigate('home'); return false;" aria-label="Voltar">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <path d="M19 12H5M12 19l-7-7 7-7"/>
                        </svg>
                    </a>
                    <h1 class="page-title">Outros</h1>
                </div>
                <div class="products-grid" id="outros-grid"></div>
            </div>
        </div>

        <!-- CARRINHO PAGE -->
        <div id="page-carrinho" class="page">
            <div class="container">
                <div class="page-header fade-in-up">
                    <a href="#" class="back-btn" onclick="navigate('home'); return false;" aria-label="Voltar">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <path d="M19 12H5M12 19l-7-7 7-7"/>
                        </svg>
                    </a>
                    <h1 class="page-title">Seu Carrinho</h1>
                </div>
                <div class="cart-container" id="cart-content"></div>
            </div>
        </div>

        <!-- CHECKOUT PAGE -->
        <div id="page-checkout" class="page">
            <div class="container">
                <div class="page-header fade-in-up">
                    <a href="#" class="back-btn" onclick="navigate('carrinho'); return false;" aria-label="Voltar">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <path d="M19 12H5M12 19l-7-7 7-7"/>
                        </svg>
                    </a>
                    <h1 class="page-title">Finalizar Pedido</h1>
                </div>
                <div class="checkout-container" id="checkout-content">
                    <!-- Formulário de checkout será renderizado aqui -->
                </div>
            </div>
        </div>
    </main>

    <!-- Floating Cart -->
    <a href="#" class="floating-cart hidden" onclick="navigate('carrinho'); return false;" aria-label="Ver carrinho">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
        </svg>
        <span>Ver Carrinho</span>
    </a>

    <script src="./script.js"></script>
</body>
</html>
